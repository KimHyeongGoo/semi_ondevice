<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>이벤트 로그 리포트</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        #layout-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        #charts-area {
            flex: 2;
        }

        #charts-container,
        #process-charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        #info-area {
            flex: 1;
            overflow-y: auto;
        }

        .chart-box {
            background: #f9f9f9;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <h2 id="title">이벤트 로그 리포트</h2>
    <!-- 1) 로그 복사/다운로드 버튼 추가 -->
    <div id="log-tools" style="margin-bottom: 10px;">
        <button id="copy-log-json">📋 JSON 복사</button>
        <button id="download-log-json">⬇️ JSON 다운로드</button>
    </div>
    <pre id="log-content" style="margin-bottom: 10px; font-size: 16px; font-weight: bold; white-space: pre-wrap;"></pre>
    <div id="layout-container">
        <div id="charts-area">
            <div id="main-chart"></div>
            <h3>이상시점 문제 파라미터 차트</h3>
            <div id="charts-container"></div>
            <h3>현재공정 전체 기간의 이상 파라미터 차트</h3>
            <div id="process-charts-container"></div>
        </div>
        <div id="info-area">
            <h3>파라미터별 실제값-예측값 차이 정보<br>(값차이가 10%이상 10초이상인 경우 감지됨)</h3>
            <div id="diff-info"></div>
        </div>
    </div>

    <script>
        let selectedStep = 10; // 예측 시점 10초

        function toKSTISOString(date) {
            const tzOffset = date.getTimezoneOffset() * 60000;
            return new Date(date - tzOffset).toISOString();
        }
        // JSON/Blob 다운로드 유틸
        function downloadBlob(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        const params = new URLSearchParams(window.location.search);
        const info = JSON.parse(decodeURIComponent(params.get("info")));
        const time = new Date(info.time);
        const param = info.parameter;

        const predictColumns = [
            'MFC7_DCS',
            'MFC8_NH3',
            'MFC1_N2-1',
            'MFC2_N2-2',
            'MFC3_N2-3',
            'MFC4_N2-4',
            'VG11 Press value',
            'VG12 Press value',
            'VG13 Press value',
            'Temp_Act_U',
            'Temp_Act_CU',
            'Temp_Act_C',
            'Temp_Act_CL',
            'Temp_Act_L',
            'MFC26_F.PWR',
            'MFC27_L.POS',
            'MFC28_R.POS'
        ];

        const start = toKSTISOString(new Date(time.getTime() - 5 * 60 * 1000));
        const end = toKSTISOString(new Date(time.getTime() + 5 * 60 * 1000));

        document.getElementById("title").innerText = `이상감지 리포트`;

        // 메시지 표시
        fetch(`/api/log_detail?time=${encodeURIComponent(info.time)}&parameter=${encodeURIComponent(param)}`)
            .then(res => res.json())
            .then(data => {
                // message가 객체일 수도 있어서 stringify
                const msgText = typeof data.message === 'string'
                    ? data.message
                    : JSON.stringify(data.message, null, 2);

                // 1) 화면에 출력
                document.getElementById("log-content").innerText = msgText;

                // 2) 복사 버튼
                document.getElementById("copy-log-json").onclick = () => {
                    navigator.clipboard.writeText(msgText)
                        .then(() => alert('로그 JSON이 클립보드에 복사되었습니다.'))
                        .catch(err => alert('복사 실패: ' + err));
                };

                // 3) 다운로드 버튼
                document.getElementById("download-log-json").onclick = () => {
                    downloadBlob(msgText, 'log.json', 'application/json');
                };
            });

        const diffInfoDiv = document.getElementById('diff-info');

        const chartsContainerEl = document.getElementById('charts-container');
        const processChartsEl = document.getElementById('process-charts-container');
        const mainChartEl = document.getElementById('main-chart');
        const infoAreaEl = document.getElementById('info-area');
        function updateInfoHeight() {
            const h = chartsContainerEl.offsetHeight + processChartsEl.offsetHeight + mainChartEl.offsetHeight;
            infoAreaEl.style.maxHeight = h + 'px';
        }
        new ResizeObserver(updateInfoHeight).observe(chartsContainerEl);
        new ResizeObserver(updateInfoHeight).observe(processChartsEl);
        new ResizeObserver(updateInfoHeight).observe(mainChartEl);


        function formatLocal(ts) {
            const d = new Date(ts);
            const p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
        }

        const highlightPlugin = {
            id: 'highlightRegion',
            beforeDatasetsDraw(chart, args, opts) {
                const { ctx, chartArea: { top, bottom }, scales: { x } } = chart;
                ctx.save();
                ctx.fillStyle = 'rgba(173, 255, 47, 0.4)';
                (opts.regions || []).forEach(r => {
                    const xStart = x.getPixelForValue(r.start);
                    const xEnd = x.getPixelForValue(r.end);
                    ctx.fillRect(xStart, top, xEnd - xStart, bottom - top);
                });
                ctx.restore();
            }
        };
        Chart.register(highlightPlugin);


        let limits = {};
        let processRange = null;
        function calcSegments(actual, predicted) {
            const predMap = new Map(predicted.map(d => [d.x, d.y]));
            let segStart = null;
            let lastTime = null;
            let maxDiff = 0;
            const segments = [];
            const regions = [];
            actual.forEach(a => {
                const pv = predMap.get(a.x);
                const t = new Date(a.x).getTime();
                if (pv === undefined) {
                    if (segStart !== null && lastTime !== null && (lastTime - segStart) >= 10000) {
                        regions.push({ start: segStart, end: lastTime });
                        segments.push({ start: formatLocal(segStart), end: formatLocal(lastTime), max: maxDiff });
                    }
                    segStart = null; maxDiff = 0; return;
                }
                const diffPct = Math.abs(a.y - pv) / (Math.abs(a.y) || 10) * 100;
                if (diffPct > 1) {
                    if (segStart === null) { segStart = t; maxDiff = diffPct; }
                    else { maxDiff = Math.max(maxDiff, diffPct); }
                } else if (segStart !== null) {
                    if (lastTime !== null && (lastTime - segStart) >= 10000) {
                        regions.push({ start: segStart, end: lastTime });
                        segments.push({ start: formatLocal(segStart), end: formatLocal(lastTime), max: maxDiff });
                    }
                    segStart = null; maxDiff = 0;
                }
                lastTime = t;
            });
            if (segStart !== null && lastTime - segStart >= 10000) {
                regions.push({ start: segStart, end: lastTime });
                segments.push({ start: formatLocal(segStart), end: formatLocal(lastTime), max: maxDiff });
            }
            return { segments, regions };
        }

        function drawMainChart() {
            fetch(`/api/event_chart?param=${encodeURIComponent(param)}&start=${start}&end=${end}&step=${selectedStep}`)
                .then(res => res.json())
                .then(json => {
                    const container = document.getElementById('main-chart');
                    const chartBox = document.createElement('div');
                    chartBox.className = 'chart-box';
                    chartBox.innerHTML = `<h4>${param}</h4><canvas id="main-chart-canvas" width="100%"></canvas>`;
                    container.appendChild(chartBox);
                    updateInfoHeight();

                    const allVals = json.actual.concat(json.predicted).map(d => d.y ?? d.value);
                    const lim = limits?.[param]?.['all'] || {};
                    if (lim.max !== undefined) allVals.push(lim.max);
                    if (lim.min !== undefined) allVals.push(lim.min);
                    const yMin = Math.min(...allVals);
                    const yMax = Math.max(...allVals);

                    const datasets = [
                        { label: '예측값', data: json.predicted.map(d => ({ x: d.x, y: d.y })), borderColor: 'red', tension: 0.3 },
                        { label: '실제값', data: json.actual.map(d => ({ x: d.x, y: d.y })), borderColor: 'blue', tension: 0.3 }
                    ];
                    if (lim.max !== undefined) datasets.push({ label: 'Upper Limit', data: json.actual.map(d => ({ x: d.x, y: lim.max })), borderColor: 'green', borderDash: [5, 5], pointRadius: 0 });
                    if (lim.min !== undefined) datasets.push({ label: 'Lower Limit', data: json.actual.map(d => ({ x: d.x, y: lim.min })), borderColor: 'orange', borderDash: [5, 5], pointRadius: 0 });
                    datasets.push({ label: '이상감지 시점', data: [{ x: time.toISOString(), y: yMin }, { x: time.toISOString(), y: yMax }], borderColor: 'black', borderDash: [5, 5], pointRadius: 0, fill: false, showLine: true });

                    new Chart(document.getElementById('main-chart-canvas'), {
                        type: 'line',
                        data: { datasets },
                        options: {
                            animation: false,
                            scales: {
                                x: { type: 'time', time: { tooltipFormat: 'HH:mm:ss' }, title: { display: true, text: '시간' } },
                                y: { title: { display: true, text: '값' }, min: yMin, max: yMax }
                            }
                        }
                    });

                });
        }

        function drawEventCharts() {
            predictColumns.forEach(p => {
                fetch(`/api/event_chart?param=${encodeURIComponent(p)}&start=${start}&end=${end}&step=${selectedStep}`)
                    .then(res => res.json())
                    .then(json => {
                        const { segments, regions } = calcSegments(json.actual, json.predicted);
                        if (segments.length === 0) return;
                        const container = document.getElementById('charts-container');
                        const chartBox = document.createElement('div');
                        chartBox.className = 'chart-box';
                        chartBox.innerHTML = `<h4>${p}</h4><canvas id="chart-${p}" width="100%"></canvas>`;
                        container.appendChild(chartBox);
                        updateInfoHeight();

                        const yValues = json.actual.concat(json.predicted).map(d => d.y ?? d.value);
                        const yMin = Math.min(...yValues);
                        const yMax = Math.max(...yValues);

                        new Chart(document.getElementById(`chart-${p}`), {
                            type: 'line',
                            data: {
                                datasets: [
                                    { label: '예측값', data: json.predicted.map(d => ({ x: d.x, y: d.y })), borderColor: 'red', tension: 0.3 },
                                    { label: '실제값', data: json.actual.map(d => ({ x: d.x, y: d.y })), borderColor: 'blue', tension: 0.3 },
                                    { label: '이상감지 시점', data: [{ x: time.toISOString(), y: yMin }, { x: time.toISOString(), y: yMax }], borderColor: 'black', borderDash: [5, 5], pointRadius: 0, fill: false, showLine: true }
                                ]
                            },
                            options: {
                                animation: false,
                                plugins: { highlightRegion: { regions } },
                                scales: {
                                    x: { type: 'time', time: { tooltipFormat: 'HH:mm:ss' }, title: { display: true, text: '시간' } },
                                    y: { title: { display: true, text: '값' }, min: yMin, max: yMax }
                                }
                            }
                        });
                    });
            });
        }

        function drawProcessCharts() {
            if (!processRange) return;
            const { start: ps, end: pe } = processRange;
            predictColumns.forEach(p => {
                fetch(`/api/trace_pred_chart?param=${encodeURIComponent(p)}&start=${encodeURIComponent(ps)}&end=${encodeURIComponent(pe)}`)
                    .then(res => res.json())
                    .then(json => {
                        const { segments, regions } = calcSegments(json.actual, json.predicted);
                        if (segments.length === 0) return;
                        const container = document.getElementById('process-charts-container');
                        const chartBox = document.createElement('div');
                        chartBox.className = 'chart-box';
                        chartBox.innerHTML = `<h4>${p}</h4><canvas id="proc-chart-${p}" width="100%"></canvas>`;
                        container.appendChild(chartBox);
                        updateInfoHeight();

                        const yValues = json.actual.concat(json.predicted).map(d => d.y ?? d.value);
                        const yMin = Math.min(...yValues);
                        const yMax = Math.max(...yValues);

                        new Chart(document.getElementById(`proc-chart-${p}`), {
                            type: 'line',
                            data: {
                                datasets: [
                                    { label: '예측값', data: json.predicted.map(d => ({ x: d.x, y: d.y })), borderColor: 'red', tension: 0.3 },
                                    { label: '실제값', data: json.actual.map(d => ({ x: d.x, y: d.y })), borderColor: 'blue', tension: 0.3 }
                                ]
                            },
                            options: {
                                animation: false,
                                plugins: { highlightRegion: { regions } },
                                scales: {
                                    x: { type: 'time', time: { tooltipFormat: 'HH:mm:ss' } },
                                    y: { min: yMin, max: yMax }
                                }
                            }
                        });

                        const infoDiv = document.createElement('div');
                        infoDiv.innerHTML = `<h4>${p}</h4>` + segments.map(s => {
                            const dur = (new Date(s.end) - new Date(s.start)) / 1000;
                            return `<div>{<br>start : ${s.start},<br>end : ${s.end},<br>diff : ${(s.max).toFixed(2)}%,<br>duration : ${dur.toFixed(0)}초<br>},</div>`;
                        }).join('');
                        diffInfoDiv.appendChild(infoDiv);
                    });
            });
        }

        Promise.all([
            fetch('/api/limits').then(res => res.json()).then(l => { limits = l; }),
            fetch(`/api/process_range?time=${encodeURIComponent(info.time)}`).then(res => res.json()).then(r => { processRange = r; })
        ]).then(() => {
            drawMainChart();
            drawEventCharts();
            drawProcessCharts();
        });
    </script>
</body>

</html>
